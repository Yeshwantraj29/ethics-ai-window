<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guarded AI Learning Window</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #555;
      margin-bottom: 40px;
    }

    .course-button {
      display: block;
      width: 80%;
      margin: 20px auto;
      padding: 20px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #111;
      color: white;
      text-decoration: none;
    }

    .course-button:hover {
      background: #333;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Guarded AI Learning Window</h1>

    <p class="subtitle">
      Think first. Use AI wisely. Make the final decision yourself.
    </p>

    <h2>Choose your course</h2>

    <a class="course-button" href="course.html?course=ethics">
      Business Ethics
    </a>

    <a class="course-button" href="course.html?course=management">
      Principles of Management
    </a>

    <a class="course-button" href="course.html?course=statistics">
      Statistics
    </a>

    <div class="footer">
      Tunghai University<br>
      Dr. Yeshwant Raj
    </div>

  </div>

</body>
</html>
